name: MemoryGG Tetris Agent APK
on:
  push:
    branches: [main]
    paths:
      - 'Tetris/**'
      - '.github/workflows/memorygg-tetris.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Build integrated target APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: Tetris
      - name: Validate APK and native library
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/libmemorygg.so'
          unzip -p app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml >/dev/null
        working-directory: Tetris
      - uses: actions/upload-artifact@v4
        with:
          name: MemoryGG-Tetris-rootless-debug-apk
          path: Tetris/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
